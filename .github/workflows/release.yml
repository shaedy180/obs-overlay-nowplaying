name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v$((python -c "from version import __version__; print(__version__)").Trim())"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py ($expected)"
          }

      - name: Build single-file EXE
        run: python build.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NowPlaying-Windows-${{ github.sha }}
          path: |
            dist/NowPlaying.exe
            dist/NowPlaying.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ (startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: 'NowPlaying-Windows-${{ github.sha }}'}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            NowPlaying.exe
            NowPlaying.exe.sha256
          generate_release_notes: true

  ci_provenance:
    name: CI provenance
    if: always()
    needs: ["build", "release"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test verification safeguards
        run: node --test .github/scripts/ci-provenance.test.cjs
      - name: Record PR validation or verify merged source
        id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["build"]'
        with:
          script: |
            await require('./.github/scripts/ci-provenance.cjs')({ github, context, core });
      - name: Preserve successful PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ci-validation.json
          if-no-files-found: error
          retention-days: 14
