name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v$((python -c "from version import __version__; print(__version__)").Trim())"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py ($expected)"
          }

      - name: Build single-file EXE
        run: python build.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-Windows-${{ github.sha }}
          path: |
            dist/NowPlaying.exe
            dist/NowPlaying.exe.sha256
          if-no-files-found: error

  release:
    if: ${{ (startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: 'NowPlaying-Windows-${{ github.sha }}'}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NowPlaying.exe
            NowPlaying.exe.sha256
          generate_release_notes: true

  ci_provenance:
    name: CI provenance
    if: always()
    needs: ["build", "release"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Test verification safeguards
        run: node --test .github/scripts/ci-provenance.test.cjs
      - name: Record PR validation or verify merged source
        id: receipt
        uses: actions/github-script@v8
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["build"]'
        with:
          script: |
            await require('./.github/scripts/ci-provenance.cjs')({ github, context, core });
      - name: Preserve successful PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ci-validation.json
          if-no-files-found: error
          retention-days: 90
