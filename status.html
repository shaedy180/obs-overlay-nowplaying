<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Now Playing Diagnostics</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; --bg:#020202; --panel:#0a0a0a; --line:rgba(255,255,255,.18); --text:#e8e8e8; --muted:#777; --accent:#39ff14; --danger:#ff3d00; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:13px/1.5 'Cascadia Mono','JetBrains Mono',Consolas,monospace; }
  main { width:min(920px,calc(100% - 28px)); margin:36px auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:18px; border-bottom:1px solid var(--line); padding-bottom:16px; }
  h1 { margin:0; font-size:20px; text-transform:uppercase; letter-spacing:.06em; }
  h2 { margin:0 0 14px; color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  .state { border:1px solid var(--line); padding:7px 10px; color:var(--muted); }
  .state.ok { border-color:var(--accent); color:var(--accent); }
  .state.bad { border-color:var(--danger); color:var(--danger); }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:18px; }
  section { border:1px solid var(--line); background:var(--panel); padding:16px; min-width:0; }
  dl { display:grid; grid-template-columns:minmax(120px,.7fr) 1fr; gap:8px 14px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  pre { margin:0; max-height:310px; overflow:auto; white-space:pre-wrap; color:var(--muted); }
  .wide { grid-column:1/-1; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  button,a { border:1px solid var(--line); border-radius:0; background:#111; color:var(--text); padding:9px 11px; font:inherit; text-decoration:none; cursor:pointer; }
  button:hover,a:hover { border-color:var(--accent); color:var(--accent); }
  @media (max-width:680px) { .grid { grid-template-columns:1fr; } .wide { grid-column:auto; } header { align-items:flex-start; flex-direction:column; } }
</style>
</head>
<body>
<main>
  <header><div><h1>Now Playing / Diagnostics</h1><div id="updated" style="color:var(--muted)">Connecting to local service</div></div><div id="state" class="state">CHECKING</div></header>
  <div class="grid">
    <section><h2>Application</h2><dl id="application"></dl></section>
    <section><h2>Media detector</h2><dl id="detector"></dl></section>
    <section class="wide"><h2>Current payload</h2><pre id="payload">No data</pre></section>
    <section class="wide"><h2>Available sources</h2><div id="sources" style="color:var(--muted)">None detected</div></section>
  </div>
  <div class="actions"><button id="refresh">Refresh</button><button id="restart">Restart media detection</button><button id="openData">Open data folder</button><a href="settings.html">Settings</a><a href="overlay.html?debug&demo" target="_blank">Overlay test</a></div>
</main>
<script>
  const escapeHtml=value=>{const node=document.createElement('span');node.textContent=String(value??'');return node.innerHTML;};
  const rows=data=>Object.entries(data).map(([key,value])=>`<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
  async function refresh(){
    try{
      const response=await fetch('/api/status?_='+Date.now(),{cache:'no-store'}), data=await response.json(); if(!response.ok)throw new Error(data.error||'Request failed');
      const healthy=data.server&&data.extractor&&!['source_unavailable','detector_error','settings_invalid'].includes(data.detectorState); document.querySelector('#state').className='state '+(healthy?'ok':'bad'); document.querySelector('#state').textContent=healthy?'HEALTHY':'ATTENTION';
      document.querySelector('#updated').textContent='Updated '+new Date().toLocaleTimeString();
      document.querySelector('#application').innerHTML=rows({Version:data.version,Port:data.port,'Settings valid':data.settingsValid,'Data directory':data.dataDirectory,'Log directory':data.logDirectory});
      document.querySelector('#detector').innerHTML=rows({State:data.detectorState,Message:data.detectorMessage||'None','Heartbeat age':data.heartbeatAge==null?'None':data.heartbeatAge+' s',Source:data.nowplaying?.source||'None',Playback:data.nowplaying?.status||'Idle'});
      document.querySelector('#payload').textContent=data.nowplaying?JSON.stringify(data.nowplaying,null,2):'No data'; document.querySelector('#sources').textContent=(data.availableSources||[]).join(', ')||'None detected';
    }catch(error){document.querySelector('#state').className='state bad';document.querySelector('#state').textContent='OFFLINE';document.querySelector('#updated').textContent=error.message;}
  }
  document.querySelector('#refresh').onclick=refresh;
  document.querySelector('#restart').onclick=async()=>{await fetch('/api/restart-detector',{method:'POST'});setTimeout(refresh,500);};
  document.querySelector('#openData').onclick=()=>fetch('/api/open-data-folder',{method:'POST'});
  refresh(); setInterval(refresh,2500);
</script>
</body>
</html>
